name: Build installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.3). No release will be created; the installer is uploaded as a workflow artifact.'
        required: true

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v',''
          } else {
            $v = '${{ github.event.inputs.version }}'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull build files from release branch
        shell: pwsh
        run: |
          git fetch origin release
          git checkout origin/release -- ClariFi.spec ClariFi.iss launcher.py clarifi.ico make_wizard_images.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install flask openpyxl pyinstaller pywebview pillow pillow-heif pypdf pg8000 scramp asn1crypto

      - name: Build PyInstaller bundle
        run: pyinstaller --noconfirm ClariFi.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Generate wizard branding images from clarifi.ico
        # ClariFi.iss references WizardImage.bmp / WizardSmallImage.bmp so the
        # installer shows the ClariFi logo instead of Inno's generic placeholder.
        # Derived from clarifi.ico (single source of truth), same as the Linux PNG.
        run: python make_wizard_images.py

      - name: Build installer
        shell: pwsh
        run: |
          # Version comes from the #define MyAppVersion in ClariFi.iss (kept in sync
          # with APP_VERSION on every release; see CLAUDE.md rule 14).
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ClariFi.iss

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/ClariFi-Setup-*.exe
          fail_on_unmatched_files: true

      - name: Upload installer as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ClariFi-Setup-${{ steps.ver.outputs.version }}
          path: Output/ClariFi-Setup-*.exe

  # Linux .deb. Thin package, mirroring how the Windows build relies on the
  # system WebView2: it does NOT bundle Python or the web engine. Instead it
  # ships the app source plus a small vendored set of pip-only pure-Python deps
  # (pywebview, pypdf), and declares everything else (Python, GTK/WebKitGTK,
  # Flask, Pillow, openpyxl) as apt Depends so `apt install` pulls them. Keeps
  # the .deb at a few MB. Runs after the Windows job so both attach to the same
  # release without racing to create it.
  release-linux:
    needs: release-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="${{ github.event.inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull build files from release branch
        run: |
          git fetch origin release
          git checkout origin/release -- launcher.py run.sh clarifi.ico clarifi.desktop build-deb.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Vendor pip-only pure-Python deps
        run: pip install --target vendor pywebview pypdf

      - name: Generate PNG icon from clarifi.ico
        run: pip install pillow && python -c "from PIL import Image; Image.open('clarifi.ico').resize((256,256)).convert('RGBA').save('clarifi.png')"

      - name: Build .deb package
        run: bash build-deb.sh "${{ steps.ver.outputs.version }}"

      - name: Attach .deb to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/clarifi_*_amd64.deb
          fail_on_unmatched_files: true

      - name: Upload .deb as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: clarifi_${{ steps.ver.outputs.version }}_amd64
          path: dist/clarifi_*_amd64.deb

  # Android APK. Independent of the desktop builds - it shares only the version
  # number - so it runs after Linux purely to avoid three jobs racing to create
  # the same GitHub Release.
  release-android:
    needs: release-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Job level, not step level: a step's `if` cannot read the `env` that step
    # declares, so the guard below was never true and the keystore was silently
    # never written. The build then failed much later, on a missing file.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="${{ github.event.inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; the release would be unsigned."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/clarifi.jks"
          test -s "$RUNNER_TEMP/clarifi.jks"

      - name: Build release APK
        working-directory: android
        env:
          CLARIFI_KEYSTORE: ${{ runner.temp }}/clarifi.jks
          CLARIFI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLARIFI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLARIFI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PclarifiVersion="${{ steps.ver.outputs.version }}"

      # Play distributes an App Bundle, not an APK, and re-signs it with the app
      # signing key it holds. The APK on the Release page is the same code signed
      # with the same key, so a side-loaded install and a Play install stay
      # interchangeable.
      - name: Build release App Bundle
        working-directory: android
        env:
          CLARIFI_KEYSTORE: ${{ runner.temp }}/clarifi.jks
          CLARIFI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLARIFI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLARIFI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PclarifiVersion="${{ steps.ver.outputs.version }}"

      - name: Name the APK after the release
        run: |
          src=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p dist
          cp "$src" "dist/ClariFi-${{ steps.ver.outputs.version }}.apk"

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClariFi-*.apk
          fail_on_unmatched_files: true

      - name: Upload APK as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ClariFi-${{ steps.ver.outputs.version }}-apk
          path: dist/ClariFi-*.apk

      # Handed to the publish job rather than rebuilt there, so the binary Google
      # reviews is byte for byte the one whose tests passed here. The R8 mapping
      # travels with it or every crash report in the console is unreadable.
      - name: Upload bundle for the Play job
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  publish-play:
    needs: release-android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download the bundle
        uses: actions/download-artifact@v4
        with:
          name: play-bundle
          path: play

      # A separate job on purpose: Play rejects a bundle for reasons that have
      # nothing to do with the build (a declaration missing, a review in flight),
      # and this can be re-run on its own once the console is happy, without
      # cutting a new tag.
      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.clarifi
          releaseFiles: play/app-release.aab
          mappingFile: play/mapping.txt
          track: production
          status: completed
